<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bộ lọc cổ phiếu</title>
<style>
  body{font-family:-apple-system,Arial,sans-serif;background:#f3f4f9;margin:0;padding:16px;color:#222}
  h1{margin:0;font-size:26px}
  .sub{color:#777;margin:2px 0 12px}
  input{width:100%;box-sizing:border-box;padding:12px;font-size:16px;border:1px solid #ddd;border-radius:12px;margin-bottom:12px}
  .cards{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
  .card{border-radius:12px;padding:8px;font-size:12px}
  .card b{display:block;font-size:24px;margin-top:4px}
  .buy{background:#e8ecfb;color:#2b44c8}
  .sell{background:#fbe8eb;color:#c8323f}
  .hold{background:#e8f5ea;color:#3a9a4a}
  .out{background:#fbf0e0;color:#c8812b}
  table{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden;font-size:13px}
  th{background:#1a237e;color:#fff;padding:8px 4px;font-size:11px}
  td{padding:10px 4px;border-bottom:1px solid #eee;text-align:center}
  .tag{padding:3px 6px;border-radius:6px;font-size:12px}
  .t-MUA{background:#e0e6fb;color:#2b44c8}
  .t-BAN{background:#fbe0e3;color:#c8323f}
  .t-GIU{background:#e0f5e4;color:#3a9a4a}
  .t-OUT{background:#fbf0e0;color:#c8812b}
  .up{color:#2b44c8}.down{color:#c8323f}
  small{color:#999;display:block}
  .pager{text-align:center;margin-top:12px}
  .pager button{width:36px;height:36px;margin:2px;border:1px solid #ddd;border-radius:8px;background:#fff;font-size:15px}
  .pager button.on{background:#2e7d32;color:#fff;border-color:#2e7d32}
</style>
</head>
<body>
<h1>Bộ lọc cổ phiếu</h1>
<div class="sub">Cập nhật lúc <b id="date" style="color:#2e7d32"></b></div>
<input id="q" placeholder="Tìm mã cổ phiếu...">
<div class="cards">
  <div class="card buy">Tín hiệu BUY<b id="nBuy">0</b></div>
  <div class="card sell">Tín hiệu SELL<b id="nSell">0</b></div>
  <div class="card hold">Đang nắm giữ<b id="nHold">0</b></div>
  <div class="card out">Đứng ngoài<b id="nOut">0</b></div>
</div>
<table>
  <thead><tr><th>MÃ</th><th>TÍN HIỆU</th><th>NGÀY BÁO</th><th>SỐ PHIÊN</th><th>% LÃI/LỖ</th><th>GIÁ</th></tr></thead>
  <tbody id="body"></tbody>
</table>
<div class="pager" id="pager"></div>

<script>
var DATA = [];
var TEN = {MUA:"MUA", BAN:"BÁN", GIU:"Nắm giữ", OUT:"Đứng ngoài"};
var PAGE_SIZE = 10, page = 1;

function loc(){
  var k = document.getElementById("q").value.trim().toUpperCase();
  return DATA.filter(function(d){ return d.ma.indexOf(k) !== -1; });
}

function dem(){
  function c(t){ return DATA.filter(function(d){ return d.tin === t; }).length; }
  document.getElementById("nBuy").textContent  = c("MUA");
  document.getElementById("nSell").textContent = c("BAN");
  document.getElementById("nHold").textContent = c("GIU");
  document.getElementById("nOut").textContent  = c("OUT");
}

function ve(){
  var ds = loc();
  var tongTrang = Math.max(1, Math.ceil(ds.length / PAGE_SIZE));
  if (page > tongTrang) page = 1;
  var tu = (page - 1) * PAGE_SIZE;
  var html = "";
  ds.slice(tu, tu + PAGE_SIZE).forEach(function(d){
    var lai = d.bao ? ((d.nay - d.bao) / d.bao * 100) : 0;
    var cls = lai >= 0 ? "up" : "down";
    html += "<tr>" +
      "<td><b>" + d.ma + "</b></td>" +
      "<td><span class='tag t-" + d.tin + "'>" + TEN[d.tin] + "</span></td>" +
      "<td>" + d.ngay + "</td>" +
      "<td>" + d.phien + " phiên</td>" +
      "<td class='" + cls + "'>" + (lai >= 0 ? "+" : "") + lai.toFixed(2) + "%</td>" +
      "<td><b>" + d.nay.toFixed(2) + "</b>" + (d.bao ? "<small>" + d.bao.toFixed(2) + "</small>" : "") + "</td>" +
      "</tr>";
  });
  document.getElementById("body").innerHTML = html || "<tr><td colspan='6'>Không có kết quả</td></tr>";

  var p = "";
  for (var i = 1; i <= tongTrang; i++){
    p += "<button class='" + (i === page ? "on" : "") + "' onclick='doiTrang(" + i + ")'>" + i + "</button>";
  }
  document.getElementById("pager").innerHTML = p;
}

function doiTrang(i){ page = i; ve(); }

document.getElementById("q").addEventListener("input", function(){ page = 1; ve(); });

fetch("data.json?t=" + Date.now())
  .then(function(r){ return r.json(); })
  .then(function(j){
    DATA = j;
    document.getElementById("date").textContent = new Date().toLocaleDateString("vi-VN");
    dem();
    ve();
  })
  .catch(function(){
    document.getElementById("body").innerHTML =
      "<tr><td colspan='6'>Chưa đọc được data.json</td></tr>";
  });
</script>
</body>
</html>
