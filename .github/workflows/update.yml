name: Cap nhat du lieu
on:
  schedule:
    - cron: "30 8 * * 1-5"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cap-nhat-du-lieu
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -U --extra-index-url https://vnstocks.com/api/simple vnstock vnai pandas
      - run: python fetch_data.py
        env:
          VNSTOCK_API_KEY: ${{ secrets.VNSTOCK_API_KEY }}
      - run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add data.json bo_qua.json
          git commit -m "cap nhat" || echo "khong co thay doi"
          git push
